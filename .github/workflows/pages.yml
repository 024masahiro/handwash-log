name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  backend:
    if: github.ref == 'refs/heads/main' && github.actor == '024masahiro'
    runs-on: ubuntu-latest
    concurrency:
      group: free-backend-setup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect backend update
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/handwash-changed-paths"
          if [ "$EVENT_NAME" = workflow_dispatch ] || grep -Eq '^(worker/|scripts/deploy-free-backend\.mjs$|backend-public-config\.json$|\.github/workflows/pages\.yml$)' "$RUNNER_TEMP/handwash-changed-paths"; then
            echo 'update=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.update == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.update == 'true'
      - name: Update running Cloudflare backend
        if: steps.changes.outputs.update == 'true'
        run: node scripts/deploy-free-backend.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  publish:
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build free-plan frontend
        run: npm run build:free
        env:
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
          HANDWASH_API_ORIGIN: ${{ vars.HANDWASH_API_ORIGIN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
